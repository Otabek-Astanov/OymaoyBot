services:
  bot:
    build: .
    container_name: oymaoy_bot
    restart: unless-stopped
    volumes:
      - .:/app
      - ./media:/app/media
      - ./.env:/app/.env:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tashkent
